[package]
name = "yousum"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yousum"
path = "src/main.rs"

[dependencies]
rusqlite  = { version = "0.31", features = ["bundled"] }
reqwest   = { version = "0.12", features = ["blocking", "json"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
lettre    = { version = "0.11", features = ["smtp-transport", "builder", "rustls-tls"] }
dotenvy   = "0.15"
anyhow    = "1"
chrono    = { version = "0.4", features = ["serde"] }

[dev-dependencies]
mockito  = "1"
tempfile = "3"

[profile.dev]
debug = 0
strip = "debuginfo"
codegen-units = 1

[profile.test]
debug = 0
strip = "debuginfo"
codegen-units = 1
